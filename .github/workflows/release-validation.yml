name: Release isolation gate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node --test scripts/check-release.test.mjs
      - run: node scripts/check-release.mjs
      - run: node scripts/test-browser-guard.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx tsc -b
      - run: npm run build
        env:
          DDYIDC_COMMIT: ${{ github.sha }}
          DDYIDC_BRANCH: ${{ github.ref_name }}
      - run: node scripts/check-release.mjs --artifact
