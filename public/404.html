<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 Not Found</title>
  <style>
    body { color: #262626; }
    .info { color: #737373; font-size: 13px; }
    @media (prefers-color-scheme: dark) {
      body { background: #030303; color: #FBFBFB; }
      .info { color: #a3a3a3; }
    }
  </style>
</head>
<body>
<center><h1>404 Not Found</h1></center>
<hr><center class="info">nginx</center>
<center class="info">
  <p>访问 IP：<!--#echo var="remote_addr" default="-" --></p>
  <p>X-Forwarded-For：<!--#echo var="http_x_forwarded_for" default="-" --></p>
  <p>请求地址：<!--#echo var="host" default="-" --><!--#echo var="request_uri" default="-" --></p>
  <p>请求方法：<!--#echo var="request_method" default="-" --></p>
  <p>访问时间：<!--#echo var="time_local" default="-" --></p>
  <p>User-Agent：<!--#echo var="http_user_agent" default="-" --></p>
  <p>Referer：<!--#echo var="http_referer" default="-" --></p>
  <p>浏览器指纹：<span id="fingerprint">-</span></p>
  <p>屏幕 / 时区：<span id="screen">-</span></p>
  <p>语言 / 平台：<span id="locale">-</span></p>
</center>
<script>
(function () {
  function canvasSignature() {
    try {
      var canvas = document.createElement("canvas");
      if (!canvas.getContext) return "";
      var ctx = canvas.getContext("2d");
      if (!ctx) return "";
      ctx.textBaseline = "top";
      ctx.font = "14px Arial";
      ctx.fillStyle = "#f60";
      ctx.fillRect(2, 2, 60, 16);
      ctx.fillStyle = "#069";
      ctx.fillText("ddyidc-404", 4, 4);
      return canvas.toDataURL();
    } catch (error) { return ""; }
  }
  function timezone() {
    try { return Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (error) { return ""; }
  }
  function hex(buffer) {
    var out = "";
    var bytes = new Uint8Array(buffer);
    for (var i = 0; i < bytes.length; i++) out += ("0" + bytes[i].toString(16)).slice(-2);
    return out;
  }
  // FNV-1a fallback keeps this page informative on browsers without SubtleCrypto.
  function fnv(text) {
    var hash = 2166136261;
    for (var i = 0; i < text.length; i++) {
      hash ^= text.charCodeAt(i);
      hash = (hash * 16777619) >>> 0;
    }
    return ("0000000" + hash.toString(16)).slice(-8) + ("0000000" + text.length.toString(16)).slice(-8);
  }
  var parts = [
    navigator.userAgent || "",
    navigator.language || "",
    navigator.languages ? navigator.languages.join(",") : "",
    navigator.platform || "",
    navigator.hardwareConcurrency || "",
    navigator.deviceMemory || "",
    screen.width + "x" + screen.height + "@" + (window.devicePixelRatio || 1),
    timezone(),
    canvasSignature()
  ];
  var text = parts.join("|");
  var screenEl = document.getElementById("screen");
  if (screenEl) screenEl.textContent = parts[6] + " / " + (parts[7] || "-");
  var localeEl = document.getElementById("locale");
  if (localeEl) localeEl.textContent = parts[1] + " / " + (parts[3] || "-");
  var target = document.getElementById("fingerprint");
  if (!target) return;
  if (window.crypto && window.crypto.subtle && window.TextEncoder) {
    window.crypto.subtle.digest("SHA-256", new TextEncoder().encode(text)).then(function (digest) {
      target.textContent = hex(digest).slice(0, 24);
    }, function () { target.textContent = fnv(text); });
  } else {
    target.textContent = fnv(text);
  }
})();
</script>
</body>
</html>
